services:
  mongodb:
    image: mongo:5.0
    container_name: ecommerce-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      MONGODB_URI: ${MONGODB_URI}
    networks:
      - app-network
    ports:
      - "5001:5001"

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    networks:
      - app-network
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge
